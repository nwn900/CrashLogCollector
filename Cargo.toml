[package]
name = "crashlog-collector"
version = "3.0.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
dirs = "6.0.0"
eframe = "0.33.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
filetime = "0.2.27"
tempfile = "3.27.0"
